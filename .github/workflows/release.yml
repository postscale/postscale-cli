name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.11'
      - name: Build release archives
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          make check
          make release VERSION="${RELEASE_TAG#v}"
          printf 'RELEASE_VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: dist/release/${{ env.RELEASE_VERSION }}/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release-assets
      - name: Verify packaged downloads offline
        run: python scripts/check-release.py release-assets

  draft:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp "releases/${RELEASE_TAG}.md" "$RUNNER_TEMP/release-notes.md"
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/release-notes.md"
          printf '\nMonorepo source commit: `%s`\n' "$(cat SOURCE_COMMIT)" >> "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag --draft --title "Postscale CLI $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
